<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Correo de prueba</title>
</head>
<body style="margin: 0; padding: 0; background-color: #0a0a0a; font-family: Arial, sans-serif;">

  <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #0a0a0a; padding: 24px 0;">
    <tr>
      <td align="center">

        <!-- Contenedor principal -->
        <table width="600" cellpadding="0" cellspacing="0"
               style="background-color: #111111; border: 1px solid #2a2a2a; border-radius: 4px; overflow: hidden;">

          <!-- Banner imagen -->
          <tr>
            <td style="padding: 0; line-height: 0;">
              <img src="https://img.freepik.com/vector-gratis/elegante-banner-lineas-rojas-digitales-brillantes_1017-23964.jpg"
                   alt="Banner"
                   width="600"
                   style="display: block; width: 100%; max-width: 600px; height: auto;">
            </td>
          </tr>

          <!-- Franja roja superior -->
          <tr>
            <td style="background-color: #c0000d; height: 3px; font-size: 0; line-height: 0;">&nbsp;</td>
          </tr>

          <!-- Encabezado -->
          <tr>
            <td style="padding: 32px 40px 24px; text-align: center;
                       background: linear-gradient(180deg, #1a0000 0%, #111111 100%);">
              <h1 style="margin: 0 0 8px; color: #ffffff; font-size: 22px; font-weight: bold;
                         letter-spacing: 2px; text-transform: uppercase;">
                Correo de Prueba
              </h1>
              <p style="margin: 0; color: #cc0010; font-size: 12px; letter-spacing: 3px; text-transform: uppercase;">
                Django &nbsp;&#9642;&nbsp; Gmail API &nbsp;&#9642;&nbsp; OAuth 2.0
              </p>
            </td>
          </tr>

          <!-- Separador con linea roja -->
          <tr>
            <td style="padding: 0 40px;">
              <table width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="border-top: 1px solid #2a2a2a;"></td>
                  <td width="60" style="border-top: 2px solid #cc0010;"></td>
                  <td style="border-top: 1px solid #2a2a2a;"></td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Cuerpo -->
          <tr>
            <td style="padding: 28px 40px 32px;">

              <p style="margin: 0 0 20px; font-size: 15px; color: #e0e0e0;">
                Hola, <strong style="color: #ff1a27;">{{ nombre }}</strong>:
              </p>

              <p style="margin: 0 0 28px; font-size: 14px; color: #aaaaaa; line-height: 1.7;">
                {{ mensaje }}
              </p>

              <!-- Lista de items -->
              {% if items %}
              <table width="100%" cellpadding="0" cellspacing="0"
                     style="background-color: #0f0f0f; border: 1px solid #2a2a2a;
                            border-left: 3px solid #cc0010; margin-bottom: 28px;">
                <tr>
                  <td style="padding: 20px 24px;">
                    <p style="margin: 0 0 14px; font-size: 11px; font-weight: bold;
                               color: #cc0010; letter-spacing: 2px; text-transform: uppercase;">
                      Detalles
                    </p>
                    {% for item in items %}
                    <p style="margin: 6px 0; font-size: 13px; color: #cccccc;">
                      <span style="color: #cc0010; font-weight: bold;">&#9658;</span>&nbsp; {{ item }}
                    </p>
                    {% endfor %}
                  </td>
                </tr>
              </table>
              {% endif %}

              <p style="margin: 0; font-size: 13px; color: #555555;">
                Si recibiste este correo, la configuracion funciona correctamente.
              </p>

            </td>
          </tr>

          <!-- Franja roja inferior -->
          <tr>
            <td style="background-color: #c0000d; height: 2px; font-size: 0; line-height: 0;">&nbsp;</td>
          </tr>

          <!-- Pie de pagina -->
          <tr>
            <td style="background-color: #0a0a0a; padding: 18px 40px; text-align: center;
                       border-top: 1px solid #1e1e1e;">
              <p style="margin: 0; font-size: 11px; color: #444444; letter-spacing: 1px; text-transform: uppercase;">
                Enviado desde Django &mdash; correos-django
              </p>
            </td>
          </tr>

        </table>
        <!-- fin contenedor -->

      </td>
    </tr>
  </table>

</body>
</html>
